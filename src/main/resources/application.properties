spring.application.name=leetcode-tracker

spring.datasource.url=jdbc:postgresql://localhost:5432/tracker
spring.datasource.username=tracker
spring.datasource.password=tracker_pw

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.ttl-minutes=60